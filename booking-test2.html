
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의실 예약 | 오송 Stn 컨퍼런스</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  color: #222;
  background: #f7f7f7;
}

header {
  padding: 28px 18px;
  text-align: center;
  color: white;
  background: #222;
}

header h1 { margin: 0 0 8px; font-size: 25px; }
header p { margin: 0; color: #ddd; }

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 16px;
}

h2 { margin: 0 0 18px; }

.rooms {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 26px;
}

.rooms button {
  padding: 16px 8px;
  border: 1px solid #d5c49a;
  border-radius: 8px;
  background: white;
  color: #333;
  font-size: 16px;
  cursor: pointer;
}

.rooms button.active,
.rooms button:hover {
  background: #343124;
  color: white;
  border-color: #343124;
}

#selected {
  margin-bottom: 12px;
  font-size: 20px;
  font-weight: bold;
}

.frame-wrap {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 12px #00000010;
}

iframe {
  display: block;
  width: 100%;
  height: 1000px;
  border: 0;
  background: white;
}

.continue-box {
  margin-top: 18px;
  padding: 22px 16px;
  background: white;
  border-radius: 10px;
  text-align: center;
}

.continue-box p {
  margin: 0 0 14px;
  color: #555;
  font-size: 14px;
  line-height: 1.7;
}

.continue-button {
  display: block;
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 17px 12px;
  border-radius: 8px;
  background: #03a85e;
  color: white;
  text-decoration: none;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.continue-button:hover {
  background: #02894d;
}

.fallback {
  padding: 16px;
  text-align: center;
}

.fallback a { color: #1769aa; }

@media (max-width: 650px) {
  .rooms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  iframe { height: 850px; }
  main { padding: 20px 12px; }
}
</style>
</head>

<body>
<header>
  <h1>오송 Stn 컨퍼런스</h1>
  <p>원하는 회의실을 선택하고 예약하세요.</p>
</header>

<main>
  <h2>회의실 선택</h2>

  <div class="rooms" id="rooms">
    <button class="active" data-room="201호" data-id="4097402">201호 · 24인실</button>
    <button data-room="202호" data-id="4097407">202호 · 8인실</button>
    <button data-room="203호" data-id="4097410">203호 · 16인실</button>
    <button data-room="204호" data-id="4097417">204호 · 20인실</button>
    <button data-room="205호" data-id="4097426">205호 · 12인실</button>
    <button data-room="206호" data-id="4097427">206호 · 16인실</button>
    <button data-room="207호" data-id="4097429">207호 · 프리미엄</button>
    <button data-room="비상주 공유오피스" data-id="8150750">비상주 공유오피스</button>
  </div>

  <div id="selected">201호 예약</div>

  <div class="frame-wrap">
    <iframe
      id="bookingFrame"
      title="네이버 예약 화면"
      src="https://booking.naver.com/booking/10/bizes/585397/items/4097402"
      allow="payment">
    </iframe>
  </div>

  <div class="continue-box">
    <p>
      예약 화면에서 다음 단계로 진행되지 않는 경우<br>
      아래 버튼을 눌러 네이버 예약에서 계속 진행해 주세요.
    </p>
    <a
      id="continueBooking"
      class="continue-button"
      href="https://booking.naver.com/booking/10/bizes/585397/items/4097402"
      target="_blank"
      rel="noopener noreferrer">
      네이버에서 예약 계속하기 ↗
    </a>
  </div>

  <div class="fallback">
    예약 화면이 보이지 않으면
    <a id="directLink"
       href="https://booking.naver.com/booking/10/bizes/585397/items/4097402"
       target="_blank"
       rel="noopener noreferrer">네이버 예약에서 열기</a>
  </div>
</main>

<script>
const buttons = document.querySelectorAll("#rooms button");
const frame = document.getElementById("bookingFrame");
const title = document.getElementById("selected");
const directLink = document.getElementById("directLink");
const continueBooking = document.getElementById("continueBooking");

buttons.forEach(button => {
  button.addEventListener("click", () => {
    const id = button.dataset.id;
    const room = button.dataset.room;

    const embedUrl =
  `https://booking.naver.com/booking/10/bizes/585397/items/${id}`;

    const directUrl =
      `https://booking.naver.com/booking/10/bizes/585397/items/${id}`;

    buttons.forEach(item => item.classList.remove("active"));
    button.classList.add("active");

    title.textContent = `${room} 예약`;
    frame.src = embedUrl;
    directLink.href = directUrl;
    continueBooking.href = directUrl;
  });
});
</script>
</body>
</html>
